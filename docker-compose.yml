version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: training_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"

volumes:
  pgdata:
