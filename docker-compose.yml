version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: training_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
